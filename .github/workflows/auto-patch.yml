name: Auto Patch Gakumas RU

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Принудительно пересобрать APK (даже если версии не менялись)'
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [translation-updated]

permissions:
  contents: write

jobs:
  build-patched-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Check Upstream Versions (Localify & RU Translation)
        id: check_upstreams
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Получаем реальную версию/тег исходников плагина chinosk6 с его git-сервера
          PLUGIN_INFO=$(curl -s https://git.chinosk6.cn/api/v1/repos/chinosk/gkms-local/releases/latest 2>/dev/null)
          PLUGIN_TAG=$(echo "$PLUGIN_INFO" | jq -r '.tag_name // empty')
          if [ -z "$PLUGIN_TAG" ] || [ "$PLUGIN_TAG" = "null" ]; then
            # Если тегов нет в API, берем последний commit sha из репозитория
            PLUGIN_TAG=$(curl -s https://git.chinosk6.cn/api/v1/repos/chinosk/gkms-local/commits?limit=1 2>/dev/null | jq -r '.[0].sha[0:7]' // "v1.2.0")
          fi
          PLUGIN_HTML_URL="https://git.chinosk6.cn/chinosk/gkms-local"

          # 2. Получаем релиз HunterKrendel234/Gakumas-Translation-Data-RU
          TRANS_JSON=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/HunterKrendel234/Gakumas-Translation-Data-RU/releases/latest)
          TRANS_TAG=$(echo "$TRANS_JSON" | jq -r '.tag_name // "v1.0.0"')
          TRANS_HTML_URL=$(echo "$TRANS_JSON" | jq -r '.html_url // "https://github.com/HunterKrendel234/Gakumas-Translation-Data-RU"')
          TRANS_URL=$(echo "$TRANS_JSON" | jq -r '[.assets[]? | select(.name | endswith(".zip")) | .browser_download_url] | first // empty')
          if [ -z "$TRANS_URL" ] || [ "$TRANS_URL" = "null" ]; then
            TRANS_URL=$(echo "$TRANS_JSON" | jq -r '.zipball_url // "https://github.com/HunterKrendel234/Gakumas-Translation-Data-RU/archive/refs/heads/main.zip"')
          fi

          echo "Plugin Tag: $PLUGIN_TAG"
          echo "Translation Tag: $TRANS_TAG"

          echo "plugin_tag=$PLUGIN_TAG" >> $GITHUB_OUTPUT
          echo "plugin_html_url=$PLUGIN_HTML_URL" >> $GITHUB_OUTPUT
          echo "trans_tag=$TRANS_TAG" >> $GITHUB_OUTPUT
          echo "trans_url=$TRANS_URL" >> $GITHUB_OUTPUT
          echo "trans_html_url=$TRANS_HTML_URL" >> $GITHUB_OUTPUT

      - name: Download Tools (apkeep, APKEditor, LSPatch)
        run: |
          mkdir -p tools
          
          # 1. apkeep
          wget -q https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-musl -O tools/apkeep || \
          wget -q https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu -O tools/apkeep
          chmod +x tools/apkeep

          # 2. APKEditor: follow Kajaqq/gaku-patcher and use the current release.
          APKEDITOR_URL=$(curl -fsSL https://api.github.com/repos/REAndroid/APKEditor/releases/latest | jq -r '[.assets[]? | select(.name | ascii_downcase | endswith(".jar")) | .browser_download_url] | first // empty')
          if [ -z "$APKEDITOR_URL" ] || [ "$APKEDITOR_URL" = "null" ]; then
            echo "::error::Could not find the latest APKEditor JAR release asset."
            exit 1
          fi
          wget -q "$APKEDITOR_URL" -O tools/APKEditor.jar

          # 3. Pin LSPatch to the verified stable build used for embedded patching.
          # Avoid silently changing patcher behavior when the upstream latest release changes.
          LSPATCH_URL="https://github.com/JingMatrix/LSPatch/releases/download/v1.2-487/lspatch-v1.2-487-release.jar"
          wget -q --show-progress "$LSPATCH_URL" -O tools/lspatch.jar
          echo "d238fdc414d121b7fa454d8b4ccf420df3a8c97d563761861ff92bd9c5da2165  tools/lspatch.jar" | sha256sum -c -
          ls -lh tools/

      - name: Check Google Play Game Version
        id: gplay
        run: |
          GAME_VER="latest"
          echo "game_ver=$GAME_VER" >> $GITHUB_OUTPUT

      - name: Compare with Latest Published Release
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CLEAN_GAME=$(echo "${{ steps.gplay.outputs.game_ver }}" | tr -cd 'a-zA-Z0-9._-')
          CLEAN_PLUGIN=$(echo "${{ steps.check_upstreams.outputs.plugin_tag }}" | tr -cd 'a-zA-Z0-9._-')
          CLEAN_TRANS=$(echo "${{ steps.check_upstreams.outputs.trans_tag }}" | tr -cd 'a-zA-Z0-9._-')

          COMBINED_TAG="g${CLEAN_GAME}_p${CLEAN_PLUGIN}_ru${CLEAN_TRANS}_cfg7"
          echo "combined_tag=$COMBINED_TAG" >> $GITHUB_OUTPUT
          echo "clean_game=$CLEAN_GAME" >> $GITHUB_OUTPUT
          echo "clean_plugin=$CLEAN_PLUGIN" >> $GITHUB_OUTPUT
          echo "clean_trans=$CLEAN_TRANS" >> $GITHUB_OUTPUT

          LAST_TAG=$(gh release view --json tagName -q '.tagName' 2>/dev/null || echo "none")
          echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT

          if [ "$LAST_TAG" = "$COMBINED_TAG" ] && [ "${{ github.event.inputs.force_build }}" != "true" ]; then
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

      - name: Cache Merged Clean Game APK
        if: steps.compare.outputs.should_build == 'true'
        id: cache-game
        uses: actions/cache@v4
        with:
          path: clean_game/gaku_merged.apk
          # Bump this key when changing the split-download/merge pipeline so an old
          # merged APK without native libraries cannot be restored from cache.
          key: gakumas-clean-apk-v4-${{ steps.gplay.outputs.game_ver }}

      - name: Download & Merge Google Play Splits (upstream-compatible)
        if: steps.compare.outputs.should_build == 'true' && steps.cache-game.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          APP_ID="com.bandainamcoent.idolmaster_gakuen"
          DOWNLOAD_ROOT="gplay_splits"
          APP_SPLITS_DIR="$DOWNLOAD_ROOT/$APP_ID"
          mkdir -p "$DOWNLOAD_ROOT" clean_game

          # Match Kajaqq/gaku-patcher: explicitly request Play split APKs and use
          # the JP device/locale configuration, instead of silently downloading a
          # single APK that may omit the ARM64 native-library split.
          ./tools/apkeep -a "$APP_ID" \
            -d google-play \
            -o "locale=jp,timezone=UTC+9,split_apk=1,include_additional_files=true" \
            -e "${{ secrets.GPLAY_EMAIL }}" \
            -t "${{ secrets.GPLAY_AAS_TOKEN }}" \
            "$DOWNLOAD_ROOT"

          # apkeep normally creates <destination>/<package-id>/. Be tolerant of
          # versions that instead place APKs directly in the destination.
          if [[ ! -d "$APP_SPLITS_DIR" ]] || ! find "$APP_SPLITS_DIR" -type f -name '*.apk' -print -quit 2>/dev/null | grep -q .; then
            if find "$DOWNLOAD_ROOT" -maxdepth 1 -type f -name '*.apk' -print -quit | grep -q .; then
              APP_SPLITS_DIR="$DOWNLOAD_ROOT"
            else
              FOUND_DIR="$(find "$DOWNLOAD_ROOT" -mindepth 1 -maxdepth 1 -type d -print -quit)"
              if [[ -n "$FOUND_DIR" ]] && find "$FOUND_DIR" -type f -name '*.apk' -print -quit | grep -q .; then
                APP_SPLITS_DIR="$FOUND_DIR"
              fi
            fi
          fi

          mapfile -t SPLIT_APKS < <(find "$APP_SPLITS_DIR" -type f -name '*.apk' -print | sort)
          if [[ ${#SPLIT_APKS[@]} -eq 0 ]]; then
            echo "::error::apkeep did not download any APK files. Contents of $DOWNLOAD_ROOT:"
            find "$DOWNLOAD_ROOT" -maxdepth 4 -type f -print || true
            exit 1
          fi

          echo "APKEditor input directory: $APP_SPLITS_DIR"
          printf 'Downloaded APK: %s\n' "${SPLIT_APKS[@]}"

          # Verify both libraries before patching. Localify's native initHook() opens
          # libil2cpp.so using ApplicationInfo.nativeLibraryDir/libil2cpp.so.
          HAS_MAIN_IN_INPUT=false
          HAS_IL2CPP_IN_INPUT=false
          for apk in "${SPLIT_APKS[@]}"; do
            if unzip -Z1 "$apk" | grep -Fx 'lib/arm64-v8a/libmain.so' >/dev/null; then
              HAS_MAIN_IN_INPUT=true
              echo "Found lib/arm64-v8a/libmain.so in source split: $apk"
            fi
            if unzip -Z1 "$apk" | grep -Fx 'lib/arm64-v8a/libil2cpp.so' >/dev/null; then
              HAS_IL2CPP_IN_INPUT=true
              echo "Found lib/arm64-v8a/libil2cpp.so in source split: $apk"
            fi
          done
          if [[ "$HAS_MAIN_IN_INPUT" != true ]]; then
            echo "::error::The downloaded Google Play APK set contains no lib/arm64-v8a/libmain.so."
            echo "This is a source-download/configuration issue; patching cannot restore a library that was never downloaded."
            exit 1
          fi
          if [[ "$HAS_IL2CPP_IN_INPUT" != true ]]; then
            echo "::error::The downloaded APK set contains no lib/arm64-v8a/libil2cpp.so, which Localify passes to initHook()."
            exit 1
          fi

          # IMPORTANT: with extractNativeLibs=false, Android can load .so files directly
          # from the APK without creating files in nativeLibraryDir. Localify passes the
          # filesystem path nativeLibraryDir/libil2cpp.so to initHook(), so extraction
          # must be enabled to make that path exist after installation.
          java -jar tools/APKEditor.jar m \
            -i "$APP_SPLITS_DIR" \
            -o clean_game/gaku_merged.apk \
            -extractNativeLibs true

          python3 - <<'PYVERIFY'
          import sys, zipfile
          apk_path = "clean_game/gaku_merged.apk"
          required_files = (
              "lib/arm64-v8a/libmain.so",
              "lib/arm64-v8a/libil2cpp.so",
          )
          try:
              with zipfile.ZipFile(apk_path) as apk:
                  entries = {item.filename: item for item in apk.infolist()}
                  native = [n for n in entries if n.startswith("lib/") and n.endswith(".so")]
                  for required in required_files:
                      item = entries.get(required)
                      if item is None or item.file_size == 0:
                          print(f"ERROR: {required} is absent/empty after APKEditor merge", file=sys.stderr)
                          print("Merged native libraries:", *native[:100], sep="\n", file=sys.stderr)
                          raise SystemExit(1)
                      print(f"Verified merged {required}: {item.file_size:,} bytes; compression={item.compress_type}")
          except zipfile.BadZipFile as exc:
              raise SystemExit(f"ERROR: APKEditor produced an invalid APK: {exc}")
          PYVERIFY

          # Verify the binary manifest explicitly enables extraction. If this is false,
          # the game may run and load the Xposed module while Localify's native hook fails
          # to open the target libil2cpp.so at nativeLibraryDir/libil2cpp.so.
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          "$BUILD_TOOLS/aapt" dump xmltree clean_game/gaku_merged.apk AndroidManifest.xml > merged_manifest.xmltree
          EXTRACT_NATIVE_LINE="$(grep -m1 'android:extractNativeLibs' merged_manifest.xmltree || true)"
          if [[ -z "$EXTRACT_NATIVE_LINE" ]] || ! grep -Eq '0xffffffff|true' <<< "$EXTRACT_NATIVE_LINE"; then
            echo "::error::Merged APK manifest does not enable android:extractNativeLibs=true."
            echo "Manifest attribute: ${EXTRACT_NATIVE_LINE:-not present}"
            exit 1
          fi
          echo "Verified android:extractNativeLibs=true: $EXTRACT_NATIVE_LINE"

          ls -lh clean_game/gaku_merged.apk

      - name: Restore Keystore
        if: steps.compare.outputs.should_build == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.jks

      - name: Build Localify RU APK, configure API defaults, and bundle Russian assets
        if: steps.compare.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRANS_URL: ${{ steps.check_upstreams.outputs.trans_url }}
          TRANS_TAG: ${{ steps.check_upstreams.outputs.trans_tag }}
          RU_API_URL: https://api.github.com/repos/HunterKrendel234/Gakumas-Translation-Data-RU/releases/latest
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 https://git.chinosk6.cn/chinosk/gkms-local.git localify-source
          cd localify-source

          # Download the published translation archive. It is expected to contain
          # local-files/ and version.txt, matching the format consumed by Localify.
          curl -fSL --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$TRANS_URL" -o ../ru_trans.zip
          unzip -tq ../ru_trans.zip
          rm -rf ../work_ru
          mkdir -p ../work_ru
          unzip -q ../ru_trans.zip -d ../work_ru

          # Locate the actual payload by its required marker instead of guessing
          # the ZIP root directory. This prevents copying a nested/empty folder.
          RU_LOCALIZATION_FILE="$(find ../work_ru -type f -path '*/local-files/localization.json' -print -quit)"
          if [[ -z "$RU_LOCALIZATION_FILE" || ! -s "$RU_LOCALIZATION_FILE" ]]; then
            echo "::error::Russian release archive has no non-empty local-files/localization.json"
            find ../work_ru -maxdepth 4 -type f -print | head -n 100 || true
            exit 1
          fi
          RU_ROOT="${RU_LOCALIZATION_FILE%/local-files/localization.json}"
          RU_FILES="$RU_ROOT/local-files"
          [[ -s "$RU_FILES/generic.json" || -d "$RU_FILES/genericTrans" ]] || {
            echo "::error::Russian translation archive lacks generic.json and genericTrans/"
            exit 1
          }

          TARGET_ASSET_DIR="app/src/main/assets/gakumas-local"
          mkdir -p "$TARGET_ASSET_DIR"

          # Fully replace the old bundled language pack. Do not merge into the
          # source pack: stale Chinese/English files can otherwise override RU.
          rm -rf "$TARGET_ASSET_DIR/local-files"
          mkdir -p "$TARGET_ASSET_DIR/local-files"
          cp -a "$RU_FILES/." "$TARGET_ASSET_DIR/local-files/"

          # Preserve the translation package's own version, not the combined
          # game/plugin/release tag. Localify uses this marker for resource sync.
          if [[ -s "$RU_ROOT/version.txt" ]]; then
            cp "$RU_ROOT/version.txt" "$TARGET_ASSET_DIR/version.txt"
          else
            printf '%s\n' "$TRANS_TAG" > "$TARGET_ASSET_DIR/version.txt"
          fi

          # The RU pack provides an Android font. Warn if that expected asset is
          # absent, but do not fail if the upstream project renames it later.
          if [[ ! -s "$TARGET_ASSET_DIR/local-files/gkanz0-ontMIX.otf" ]]; then
            echo "::warning::RU Android font gkanz0-ontMIX.otf was not found in the latest pack. Checking available fonts:"
            find "$TARGET_ASSET_DIR/local-files" -maxdepth 2 -type f \( -iname '*.otf' -o -iname '*.ttf' \) -print || true
          fi

          # Make initial game configuration compatible with the RU pack.
          # Upstream translation instructions require lazyInit/Fast Initialization
          # off and MasterDB localization on. Texture replacement is explicitly off.
          python3 - <<'PYCONFIG'
          import json
          import re
          from pathlib import Path

          ru_api = "https://api.github.com/repos/HunterKrendel234/Gakumas-Translation-Data-RU/releases/latest"
          root = Path.cwd()
          target_assets = root / "app/src/main/assets/gakumas-local"

          def set_bool_property(path: Path, key: str, value: bool, required: bool = True):
              text = path.read_text(encoding="utf-8")
              pattern = re.compile(rf"(\bvar\s+{re.escape(key)}\s*:\s*Boolean\s*=\s*)(true|false)\b")
              updated, count = pattern.subn(lambda m: m.group(1) + ("true" if value else "false"), text)
              if required and count != 1:
                  raise SystemExit(f"Expected exactly one Boolean default for {key} in {path}, found {count}")
              if count:
                  path.write_text(updated, encoding="utf-8")
                  print(f"Set {path}: {key}={str(value).lower()}")

          # These are the per-game hook settings used by the embedded module.
          gakumas_models = list((root / "app/src/main/java").rglob("GakumasConfig.kt"))
          if len(gakumas_models) != 1:
              raise SystemExit(f"Expected one GakumasConfig.kt, found {len(gakumas_models)}")
          gakumas_model = gakumas_models[0]
          set_bool_property(gakumas_model, "lazyInit", False)
          set_bool_property(gakumas_model, "replaceTexture", False)
          set_bool_property(gakumas_model, "useMasterTrans", True)
          set_bool_property(gakumas_model, "enabled", True, required=False)

          # ProgramConfig drives the Resource Settings screen and API updater.
          # Enable API updates by default and make the RU release API the initial URL.
          program_models = list((root / "app/src/main/java").rglob("ProgramConfig.kt"))
          if len(program_models) != 1:
              raise SystemExit(f"Expected one ProgramConfig.kt, found {len(program_models)}")
          program_model = program_models[0]
          set_bool_property(program_model, "checkBuiltInAssets", False)
          set_bool_property(program_model, "useRemoteAssets", False)
          set_bool_property(program_model, "useAPIAssets", True)
          set_bool_property(program_model, "useAPITextureAssets", False)
          program_text = program_model.read_text(encoding="utf-8")
          url_pattern = re.compile(r'(\bvar\s+useAPIAssetsURL\s*:\s*String\s*=\s*)"(?:[^"\\]|\\.)*"')
          program_text, url_count = url_pattern.subn(lambda m: m.group(1) + json.dumps(ru_api), program_text)
          if url_count != 1:
              raise SystemExit(f"Expected exactly one useAPIAssetsURL default in {program_model}, found {url_count}")
          program_model.write_text(program_text, encoding="utf-8")
          print(f"Set {program_model}: useAPIAssetsURL={ru_api}")

          # Keep the upstream Localify configuration handshake intact. Since the
          # standalone Localify app is installed alongside the game, GakumasHookMain
          # must retain requestConfig() and loadConfig(gkmsData) exactly as upstream
          # expects. Do not replace these calls with a synthetic config: that can
          # bypass the installed app's settings and alter initialization order.
          hook_files = list((root / "app/src/main/java").rglob("GakumasHookMain.kt"))
          if len(hook_files) != 1:
              raise SystemExit(f"Expected one GakumasHookMain.kt, found {len(hook_files)}")
          hook_path = hook_files[0]
          hook_text = hook_path.read_text(encoding="utf-8")
          if hook_text.count("requestConfig(app.applicationContext)") != 1:
              raise SystemExit("Upstream requestConfig(app.applicationContext) flow is missing or changed")
          if hook_text.count("loadConfig(gkmsData)") != 1:
              raise SystemExit("Upstream loadConfig(gkmsData) flow is missing or changed")

          # Add diagnostics only: retain the original FilesChecker/initHook order and
          # arguments. The toast happens before these calls, so it does not prove that
          # assets were copied or that the native hooks initialized successfully.
          asset_marker = "FilesChecker.initDir(app.filesDir, modulePath)"
          asset_diagnostic = '''FilesChecker.initDir(app.filesDir, modulePath)
              val localifyAssetRoot = File(app.filesDir, FilesChecker.localizationFilesDir)
              val ruLocalizationFile = File(localifyAssetRoot, "local-files/localization.json")
              val ruGenericFile = File(localifyAssetRoot, "local-files/generic.json")
              val ruVersionFile = File(localifyAssetRoot, "version.txt")
              val ruVersionText = runCatching { if (ruVersionFile.isFile) ruVersionFile.readText().trim() else "missing" }.getOrDefault("unreadable")
              Log.i(TAG, "Localify asset check: root=${localifyAssetRoot.absolutePath}, localization=${ruLocalizationFile.isFile} (${ruLocalizationFile.length()} bytes), generic=${ruGenericFile.isFile} (${ruGenericFile.length()} bytes), version=$ruVersionText")'''
          asset_count = hook_text.count(asset_marker)
          if asset_count != 1:
              raise SystemExit(f"Expected one FilesChecker.initDir call, found {asset_count}")
          hook_text = hook_text.replace(asset_marker, asset_diagnostic, 1)

          # Log the actual library path before calling the upstream native initializer,
          # then log return. No hook args or lifecycle conditions are changed.
          init_pattern = re.compile(
              r'(?m)^([ \t]*)initHook\([ \t]*\n[ \t]*"\$\{app\.applicationInfo\.nativeLibraryDir\}/libil2cpp\.so",[ \t]*\n[ \t]*File\([ \t]*\n[ \t]*app\.filesDir\.absolutePath,[ \t]*\n[ \t]*FilesChecker\.localizationFilesDir[ \t]*\n[ \t]*\)\.absolutePath[ \t]*\n[ \t]*\)'
          )
          def instrument_init(match):
              indent = match.group(1)
              original_call = match.group(0)
              return (
                  f'{indent}Log.i(TAG, "Localify initHook begin: il2cpp=" + app.applicationInfo.nativeLibraryDir + "/libil2cpp.so, localizationRoot=" + File(app.filesDir, FilesChecker.localizationFilesDir).absolutePath)\n'
                  + original_call
                  + f'\n{indent}Log.i(TAG, "Localify initHook call returned")'
              )
          hook_text, init_count = init_pattern.subn(instrument_init, hook_text)
          if init_count != 1:
              raise SystemExit(f"Expected one upstream initHook call to instrument, found {init_count}")

          # Confirm the upstream config handoff remains present. This log is
          # observational only; loadConfig still receives the original gkmsData.
          config_diag = '''loadConfig(gkmsData)
              Log.i(TAG, "Localify config handoff: gkmsData received; localData=${programData != null}, configLength=${gkmsData.length}")'''
          hook_text, config_count = re.subn(r'\bloadConfig\(gkmsData\)', lambda _: config_diag, hook_text, count=1)
          if config_count != 1:
              raise SystemExit("Could not add the config-handoff diagnostic without changing the upstream call")
          if hook_text.count("loadConfig(gkmsData)") != 1:
              raise SystemExit("Instrumentation changed the upstream native config handoff")

          hook_path.write_text(hook_text, encoding="utf-8")
          print(f"Instrumented {hook_path} without replacing requestConfig/loadConfig flow")

          # Also replace the fallback URL used when the saved URL is empty.
          values_dir = root / "app/src/main/res"
          string_resources = list(values_dir.glob("values*/strings.xml"))
          string_re = re.compile(r'(<string\s+name="default_assets_check_api"[^>]*>)(.*?)(</string>)', re.DOTALL)
          total_replacements = 0
          for path in string_resources:
              text = path.read_text(encoding="utf-8")
              updated, count = string_re.subn(lambda m: m.group(1) + ru_api + m.group(3), text)
              if count:
                  path.write_text(updated, encoding="utf-8")
                  total_replacements += count
                  print(f"Updated RU API fallback in {path}")
          if total_replacements == 0:
              raise SystemExit("No default_assets_check_api string resource was found to patch")

          # Some revisions ship an asset-side localizationConfig.json; patch it
          # when present while preserving every unrelated option in that file.
          config_candidates = list((root / "app/src/main/assets").rglob("localizationConfig.json"))
          for path in config_candidates:
              try:
                  config = json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  raise SystemExit(f"Invalid JSON in {path}: {exc}")
              config["enabled"] = True
              config["lazyInit"] = False
              config["replaceTexture"] = False
              config["useMasterTrans"] = True
              path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              print(f"Updated game config asset: {path}")

          # Validate source defaults and bundled data before Gradle packages them.
          current = program_model.read_text(encoding="utf-8")
          if "useAPIAssets: Boolean = true" not in current or ru_api not in current:
              raise SystemExit("ProgramConfig API defaults did not survive source patch")
          cfg = gakumas_model.read_text(encoding="utf-8")
          if not re.search(r"var\s+lazyInit\s*:\s*Boolean\s*=\s*false", cfg):
              raise SystemExit("Fast Initialization/lazyInit is not disabled by default")
          if not re.search(r"var\s+replaceTexture\s*:\s*Boolean\s*=\s*false", cfg):
              raise SystemExit("Replace Texture is not disabled by default")
          if not re.search(r"var\s+useMasterTrans\s*:\s*Boolean\s*=\s*true", cfg):
              raise SystemExit("MasterDB localization is not enabled by default")
          for required in ("localization.json",):
              p = target_assets / "local-files" / required
              if not p.is_file() or p.stat().st_size == 0:
                  raise SystemExit(f"Missing/empty bundled Russian file: {p}")
          if not (target_assets / "local-files" / "generic.json").is_file() and not (target_assets / "local-files" / "genericTrans").is_dir():
              raise SystemExit("No generic translation data was bundled")
          version = target_assets / "version.txt"
          if not version.is_file() or not version.read_text(encoding="utf-8").strip():
              raise SystemExit("Bundled version.txt is missing/empty")
          print("Verified RU assets and Localify defaults:")
          print(f"  translation version: {version.read_text(encoding='utf-8').strip()}")
          print(f"  bundled files: {sum(1 for p in (target_assets / 'local-files').rglob('*') if p.is_file())}")
          print("  checkBuiltInAssets=false, useRemoteAssets=false, useAPIAssets=true, RU API URL set")
          print("  lazyInit=false, useMasterTrans=true, replaceTexture=false, useAPITextureAssets=false")
          print("  upstream TranslucentActivity/requestConfig handoff retained; initHook and asset-copy diagnostics added")
          PYCONFIG

          chmod +x gradlew
          ./gradlew assembleRelease

          BUILT_APK="$(find app/build/outputs/apk -type f -name '*release*.apk' -print -quit)"
          if [[ -z "$BUILT_APK" || ! -s "$BUILT_APK" ]]; then
            BUILT_APK="$(find . -type f -name '*release*.apk' -not -path './.gradle/*' -print -quit)"
          fi
          if [[ -z "$BUILT_APK" || ! -s "$BUILT_APK" ]]; then
            echo "::error::Could not find the compiled Localify release APK"
            find . -type f -name '*.apk' -print || true
            exit 1
          fi
          echo "Built Localify APK: $BUILT_APK"

          # Assert the final manager/module APK really contains Russian resources
          # and the settings defaults that will be embedded into the game APK.
          unzip -Z1 "$BUILT_APK" | grep -Fxq 'assets/gakumas-local/local-files/localization.json' || {
            echo "::error::Built Localify APK has no bundled localization.json"
            exit 1
          }
          unzip -Z1 "$BUILT_APK" | grep -Fxq 'assets/gakumas-local/version.txt' || {
            echo "::error::Built Localify APK has no bundled translation version.txt"
            exit 1
          }
          unzip -p "$BUILT_APK" assets/gakumas-local/version.txt | grep -q . || {
            echo "::error::Bundled translation version.txt is empty"
            exit 1
          }
          # Confirm the RU API URL made it into the compiled Kotlin bytecode and
          # any packaged localizationConfig.json still has the intended switches.
          python3 - "$BUILT_APK" "$RU_API_URL" <<'PYAPKVERIFY'
          import sys, zipfile, json
          apk_path, expected_url = sys.argv[1], sys.argv[2]
          with zipfile.ZipFile(apk_path) as apk:
              dex_names = [n for n in apk.namelist() if n.endswith('.dex')]
              dex_contents = [apk.read(n) for n in dex_names]
              if not any(expected_url.encode('utf-8') in data for data in dex_contents):
                  raise SystemExit('::error::Russian releases/latest URL is missing from compiled DEX files')
              config_path = 'assets/gakumas-local/localizationConfig.json'
              if config_path in apk.namelist():
                  config = json.loads(apk.read(config_path).decode('utf-8'))
                  required = {'enabled': True, 'lazyInit': False, 'replaceTexture': False, 'useMasterTrans': True}
                  wrong = {k: (config.get(k), v) for k, v in required.items() if config.get(k) != v}
                  if wrong:
                      raise SystemExit(f'::error::Packaged localizationConfig.json has incorrect settings: {wrong}')
              print(f'Verified compiled RU API URL and packaged Localify settings in {apk_path}')
          PYAPKVERIFY
          cp "$BUILT_APK" ../Gakumas-Localify-RU-unsigned.apk
          cd ..

          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          "$BUILD_TOOLS/zipalign" -p -f 4 Gakumas-Localify-RU-unsigned.apk Gakumas-Localify-RU-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks release.jks \
            --ks-pass "pass:${{ secrets.KS_PASS }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --key-pass "pass:${{ secrets.KEY_PASS }}" \
            --out Gakumas-Localify-RU.apk \
            Gakumas-Localify-RU-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose Gakumas-Localify-RU.apk
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 Gakumas-Localify-RU.apk
          ls -lh Gakumas-Localify-RU.apk

      - name: Patch Game APK with LSPatch (publish its output unchanged)
        if: steps.compare.outputs.should_build == 'true'
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
          GAME_VER: ${{ steps.gplay.outputs.game_ver }}
        shell: bash
        run: |
          set -euo pipefail

          # Do not unzip, zip, zipalign, or re-sign LSPatch's output afterwards.
          # LSPatch can intentionally use overlapping ZIP ranges for origin.apk;
          # standard ZIP rewrite tools may corrupt that layout. Both referenced
          # upstream workflows publish the direct LSPatch output.
          echo "Using pinned LSPatch v1.2-487; SHA-256 verified during tool download."
          rm -rf patched_out
          mkdir -p patched_out
          java -jar tools/lspatch.jar clean_game/gaku_merged.apk \
            -m Gakumas-Localify-RU.apk \
            -o patched_out/ \
            --add-permission REQUEST_INSTALL_PACKAGES \
            --force \
            -k release.jks "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS"

          LSPATCHED_APK="$(find patched_out -type f -name '*-lspatched.apk' -print -quit)"
          if [[ -z "$LSPATCHED_APK" ]]; then
            LSPATCHED_APK="$(find patched_out -type f -name '*.apk' -print -quit)"
          fi
          if [[ -z "$LSPATCHED_APK" || ! -s "$LSPATCHED_APK" ]]; then
            echo "::error::LSPatch did not produce a valid APK."
            find patched_out -maxdepth 2 -type f -print || true
            exit 1
          fi

          OUTPUT_APK="Gakumas-RU-${GAME_VER}.apk"
          cp -- "$LSPATCHED_APK" "$OUTPUT_APK"
          echo "Published artifact candidate: $OUTPUT_APK"
          ls -lh "$LSPATCHED_APK" "$OUTPUT_APK"
          sha256sum "$OUTPUT_APK"

          # Validate the merged source, not LSPatch's overlapping ZIP layout.
          # The source APK check in the prior step guarantees libmain.so was present
          # before patching. Preserve LSPatch output byte-for-byte after this point.

      - name: Publish GitHub Release
        if: steps.compare.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.compare.outputs.combined_tag }}
          name: "Gakumas RU (${{ steps.gplay.outputs.game_ver }} | RU ${{ steps.check_upstreams.outputs.trans_tag }})"
          body: |
            ### Готовый APK Gakuen Idolmaster с вшитым русским переводом и Localify
            * **Версия игры (Google Play):** `${{ steps.gplay.outputs.game_ver }}`
            * **Версия перевода (Gakumas-Translation-Data-RU):** [`${{ steps.check_upstreams.outputs.trans_tag }}`](${{ steps.check_upstreams.outputs.trans_html_url }})
            * **Версия плагина (chinosk6 Localify):** [`${{ steps.check_upstreams.outputs.plugin_tag }}`](${{ steps.check_upstreams.outputs.plugin_html_url }})
            * **LSPatch:** pinned `v1.2-487` (SHA-256 verified)
            * **Native library extraction:** enabled, required by Localify's `nativeLibraryDir/libil2cpp.so` init path

            #### Установка:
            1. Установите **`Gakumas-RU-${{ steps.gplay.outputs.game_ver }}.apk`** и **`Gakumas-Localify-RU.apk`**. Русский набор встроен в модуль; установленный Localify сохраняет штатную передачу настроек.
            2. Откройте Localify и запускайте игру через него, чтобы штатный `TranslucentActivity` передал игровые настройки. Встроенные ресурсы остаются резервным набором.

            Настройки по умолчанию: Fast Initialization выключен, MasterDB Localization включен, Replace Texture выключен. Конфигурация передаётся штатным механизмом Localify; в логе доступны отдельные отметки копирования ресурсов и вызова initHook.
          files: |
            Gakumas-RU-${{ steps.gplay.outputs.game_ver }}.apk
            Gakumas-Localify-RU.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Discord Notification
        if: steps.compare.outputs.should_build == 'true'
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          LAST_TAG="${{ steps.compare.outputs.last_tag }}"
          CUR_GAME="${{ steps.compare.outputs.clean_game }}"
          CUR_PLUGIN="${{ steps.compare.outputs.clean_plugin }}"
          CUR_TRANS="${{ steps.compare.outputs.clean_trans }}"

          CHANGES=""
          if [ "$LAST_TAG" = "none" ]; then
            CHANGES="🎉 **Первый автоматический релиз готового APK!**"
          else
            # Remove the workflow/config revision suffix before comparing component versions.
            LAST_TAG_CORE=$(echo "$LAST_TAG" | sed -E 's/_cfg[0-9]+$//')
            OLD_GAME=$(echo "$LAST_TAG_CORE" | sed -n 's/^g\(.*\)_p\(.*\)_ru\(.*\)$/\1/p')
            OLD_PLUGIN=$(echo "$LAST_TAG_CORE" | sed -n 's/^g\(.*\)_p\(.*\)_ru\(.*\)$/\2/p')
            OLD_TRANS=$(echo "$LAST_TAG_CORE" | sed -n 's/^g\(.*\)_p\(.*\)_ru\(.*\)$/\3/p')

            if [ "$OLD_GAME" != "$CUR_GAME" ]; then
              CHANGES="${CHANGES}🎮 **Обновилась игра в Google Play:** \`${OLD_GAME:-?}\` ➔ \`${CUR_GAME}\`\n"
            fi
            if [ "$OLD_PLUGIN" != "$CUR_PLUGIN" ]; then
              CHANGES="${CHANGES}🛠️ **Обновился Gakumas Localify (chinosk6):** \`${OLD_PLUGIN:-?}\` ➔ \`${CUR_PLUGIN}\`\n"
            fi
            if [ "$OLD_TRANS" != "$CUR_TRANS" ]; then
              CHANGES="${CHANGES}🇷🇺 **Обновился русский перевод:** \`${OLD_TRANS:-?}\` ➔ \`${CUR_TRANS}\`\n"
            fi
            if [ -z "$CHANGES" ]; then
              CHANGES="🔄 **Принудительная пересборка APK** (версии компонентов не менялись)"
            fi
          fi

          CHANGES_FORMATTED=$(printf "%b" "$CHANGES")

          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${{ steps.compare.outputs.combined_tag }}"
          GAME_DL="https://github.com/${{ github.repository }}/releases/download/${{ steps.compare.outputs.combined_tag }}/Gakumas-RU-${{ steps.gplay.outputs.game_ver }}.apk"
          MANAGER_DL="https://github.com/${{ github.repository }}/releases/download/${{ steps.compare.outputs.combined_tag }}/Gakumas-Localify-RU.apk"
          ORIG_LOCALIFY_URL="${{ steps.check_upstreams.outputs.plugin_html_url }}"
          TRANS_REL_URL="${{ steps.check_upstreams.outputs.trans_html_url }}"

          jq -n \
            --arg title "Доступно обновление Gakumas RU (${{ steps.gplay.outputs.game_ver }})" \
            --arg url "$RELEASE_URL" \
            --arg changes "$CHANGES_FORMATTED" \
            --arg game_ver "${{ steps.gplay.outputs.game_ver }}" \
            --arg trans_ver "${{ steps.check_upstreams.outputs.trans_tag }}" \
            --arg plugin_ver "${{ steps.check_upstreams.outputs.plugin_tag }}" \
            --arg rel_url "$RELEASE_URL" \
            --arg game_dl "$GAME_DL" \
            --arg mgr_dl "$MANAGER_DL" \
            --arg orig_loc_url "$ORIG_LOCALIFY_URL" \
            --arg trans_url "$TRANS_REL_URL" \
            '{
              username: "Gakumas Auto-Patcher RU",
              embeds: [{
                title: $title,
                url: $url,
                color: 16738740,
                description: $changes,
                fields: [
                  { name: "Версия игры", value: ("`" + $game_ver + "`"), inline: true },
                  { name: "Русский перевод", value: ("[" + $trans_ver + "](" + $trans_url + ")"), inline: true },
                  { name: "Оригинал Localify", value: ("[" + $plugin_ver + "](" + $orig_loc_url + ")"), inline: true },
                  {
                    name: "Ссылки и скачивание",
                    value: (
                      "📦 **[Страница нашего релиза APK на GitHub](" + $rel_url + ")**\n" +
                      "📲 [Скачать готовый APK игры (Gakumas-RU.apk)](" + $game_dl + ")\n" +
                      "⚙️ [Скачать менеджер Gakumas-Localify-RU.apk](" + $mgr_dl + ")\n" +
                      "🔗 [Оригинальный репозиторий Localify (chinosk6)](" + $orig_loc_url + ")"
                    )
                  }
                ],
                timestamp: (now | todate)
              }]
            }' > payload.json

          curl -s -H "Content-Type: application/json" -X POST -d @payload.json "$WEBHOOK_URL"