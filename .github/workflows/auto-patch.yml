name: Auto Patch Gakumas RU

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Принудительно пересобрать APK (даже если версии не менялись)'
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [translation-updated]

permissions:
  contents: write

jobs:
  build-patched-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Check Upstream Versions (Localify & RU Translation)
        id: check_upstreams
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Получаем реальную версию/тег исходников плагина chinosk6 с его git-сервера
          PLUGIN_INFO=$(curl -s https://git.chinosk6.cn/api/v1/repos/chinosk/gkms-local/releases/latest 2>/dev/null)
          PLUGIN_TAG=$(echo "$PLUGIN_INFO" | jq -r '.tag_name // empty')
          if [ -z "$PLUGIN_TAG" ] || [ "$PLUGIN_TAG" = "null" ]; then
            # Если тегов нет в API, берем последний commit sha из репозитория
            PLUGIN_TAG=$(curl -s https://git.chinosk6.cn/api/v1/repos/chinosk/gkms-local/commits?limit=1 2>/dev/null | jq -r '.[0].sha[0:7]' // "v1.2.0")
          fi
          PLUGIN_HTML_URL="https://git.chinosk6.cn/chinosk/gkms-local"

          # 2. Получаем релиз HunterKrendel234/Gakumas-Translation-Data-RU
          TRANS_JSON=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/HunterKrendel234/Gakumas-Translation-Data-RU/releases/latest)
          TRANS_TAG=$(echo "$TRANS_JSON" | jq -r '.tag_name // "v1.0.0"')
          TRANS_HTML_URL=$(echo "$TRANS_JSON" | jq -r '.html_url // "https://github.com/HunterKrendel234/Gakumas-Translation-Data-RU"')
          TRANS_URL=$(echo "$TRANS_JSON" | jq -r '[.assets[]? | select(.name | endswith(".zip")) | .browser_download_url] | first // empty')
          if [ -z "$TRANS_URL" ] || [ "$TRANS_URL" = "null" ]; then
            TRANS_URL=$(echo "$TRANS_JSON" | jq -r '.zipball_url // "https://github.com/HunterKrendel234/Gakumas-Translation-Data-RU/archive/refs/heads/main.zip"')
          fi

          echo "Plugin Tag: $PLUGIN_TAG"
          echo "Translation Tag: $TRANS_TAG"

          echo "plugin_tag=$PLUGIN_TAG" >> $GITHUB_OUTPUT
          echo "plugin_html_url=$PLUGIN_HTML_URL" >> $GITHUB_OUTPUT
          echo "trans_tag=$TRANS_TAG" >> $GITHUB_OUTPUT
          echo "trans_url=$TRANS_URL" >> $GITHUB_OUTPUT
          echo "trans_html_url=$TRANS_HTML_URL" >> $GITHUB_OUTPUT

      - name: Download Tools (apkeep, APKEditor, LSPatch)
        run: |
          mkdir -p tools
          
          # 1. apkeep
          wget -q https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-musl -O tools/apkeep || \
          wget -q https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu -O tools/apkeep
          chmod +x tools/apkeep

          # 2. APKEditor
          wget -q https://github.com/REAndroid/APKEditor/releases/download/V1.4.1/APKEditor-1.4.1.jar -O tools/APKEditor.jar

          # 3. LSPatch (JingMatrix)
          LSPATCH_URL=$(curl -s https://api.github.com/repos/JingMatrix/LSPatch/releases/latest | jq -r '[.assets[]? | select(.name | endswith(".jar")) | .browser_download_url] | first // empty')
          if [ -z "$LSPATCH_URL" ] || [ "$LSPATCH_URL" = "null" ]; then
            LSPATCH_URL=$(curl -s https://api.github.com/repos/JingMatrix/LSPatch/releases/latest | jq -r '[.assets[]? | select(.name | endswith(".zip")) | .browser_download_url] | first // empty')
            wget -q "$LSPATCH_URL" -O tools/lspatch.zip
            unzip -q -j tools/lspatch.zip "*.jar" -d tools/
            mv tools/*.jar tools/lspatch.jar 2>/dev/null || true
          else
            wget -q "$LSPATCH_URL" -O tools/lspatch.jar
          fi

          ls -lh tools/

      - name: Check Google Play Game Version
        id: gplay
        run: |
          GAME_VER="latest"
          echo "game_ver=$GAME_VER" >> $GITHUB_OUTPUT

      - name: Compare with Latest Published Release
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CLEAN_GAME=$(echo "${{ steps.gplay.outputs.game_ver }}" | tr -cd 'a-zA-Z0-9._-')
          CLEAN_PLUGIN=$(echo "${{ steps.check_upstreams.outputs.plugin_tag }}" | tr -cd 'a-zA-Z0-9._-')
          CLEAN_TRANS=$(echo "${{ steps.check_upstreams.outputs.trans_tag }}" | tr -cd 'a-zA-Z0-9._-')

          COMBINED_TAG="g${CLEAN_GAME}_p${CLEAN_PLUGIN}_ru${CLEAN_TRANS}"
          echo "combined_tag=$COMBINED_TAG" >> $GITHUB_OUTPUT
          echo "clean_game=$CLEAN_GAME" >> $GITHUB_OUTPUT
          echo "clean_plugin=$CLEAN_PLUGIN" >> $GITHUB_OUTPUT
          echo "clean_trans=$CLEAN_TRANS" >> $GITHUB_OUTPUT

          LAST_TAG=$(gh release view --json tagName -q '.tagName' 2>/dev/null || echo "none")
          echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT

          if [ "$LAST_TAG" = "$COMBINED_TAG" ] && [ "${{ github.event.inputs.force_build }}" != "true" ]; then
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

      - name: Cache Merged Clean Game APK
        if: steps.compare.outputs.should_build == 'true'
        id: cache-game
        uses: actions/cache@v4
        with:
          path: clean_game/gaku_merged.apk
          key: gakumas-clean-apk-${{ steps.gplay.outputs.game_ver }}

      - name: Download & Merge Game Splits (Fixed lib/arm64)
        if: steps.compare.outputs.should_build == 'true' && steps.cache-game.outputs.cache-hit != 'true'
        run: |
          mkdir -p gplay_splits clean_game
          
          ./tools/apkeep -a com.bandainamcoent.idolmaster_gakuen \
            -d google-play \
            -e "${{ secrets.GPLAY_EMAIL }}" \
            -t "${{ secrets.GPLAY_AAS_TOKEN }}" \
            ./gplay_splits/

          ls -lh ./gplay_splits/

          # Гарантированно указываем путь со всеми скачанными сплитами для APKEditor
          java -jar tools/APKEditor.jar m -i ./gplay_splits -o clean_game/gaku_merged.apk
          ls -lh clean_game/gaku_merged.apk

      - name: Restore Keystore
        if: steps.compare.outputs.should_build == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.jks

      - name: Build Localify RU APK from Source & Inject Translation
        if: steps.compare.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone https://git.chinosk6.cn/chinosk/gkms-local.git localify-source
          cd localify-source

          curl -sL -H "Authorization: Bearer $GH_TOKEN" "${{ steps.check_upstreams.outputs.trans_url }}" -o ../ru_trans.zip
          mkdir -p ../work_ru
          unzip -q ../ru_trans.zip -d ../work_ru || true

          RU_ROOT="../work_ru"
          if [ ! -d "$RU_ROOT/local-files" ] && [ -z "$(find "$RU_ROOT" -maxdepth 1 -name '*.json')" ]; then
            SUBDIR=$(find ../work_ru -mindepth 1 -maxdepth 1 -type d | head -n 1)
            if [ -n "$SUBDIR" ]; then RU_ROOT="$SUBDIR"; fi
          fi

          TARGET_ASSET_DIR="app/src/main/assets/gakumas-local"
          mkdir -p "$TARGET_ASSET_DIR/local-files"

          mkdir -p ../saved_fonts
          find "$TARGET_ASSET_DIR" -type f \( -name "*.ttf" -o -name "*.otf" \) -exec cp {} ../saved_fonts/ \; 2>/dev/null || true

          rm -rf "$TARGET_ASSET_DIR/local-files/"*

          if [ -d "$RU_ROOT/local-files" ]; then
            cp -r "$RU_ROOT/local-files/"* "$TARGET_ASSET_DIR/local-files/"
          else
            cp -r "$RU_ROOT/"* "$TARGET_ASSET_DIR/local-files/" 2>/dev/null || true
          fi

          for font in ../saved_fonts/*; do
            [ -e "$font" ] || continue
            fname=$(basename "$font")
            if [ -z "$(find "$TARGET_ASSET_DIR" -name "$fname")" ]; then
              cp "$font" "$TARGET_ASSET_DIR/local-files/"
            fi
          done

          echo "${{ steps.compare.outputs.combined_tag }}" > "$TARGET_ASSET_DIR/version.txt"

          chmod +x gradlew
          ./gradlew assembleRelease

          # Надежный поиск скомпилированного APK плагина
          BUILT_APK=$(find . -name "*release*.apk" | head -n 1)
          if [ -z "$BUILT_APK" ]; then
            BUILT_APK=$(find . -name "*.apk" | head -n 1)
          fi
          echo "Найден собранный APK плагина: $BUILT_APK"
          cp "$BUILT_APK" ../Gakumas-Localify-RU-unsigned.apk
          cd ..

          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS/zipalign" -p -f 4 Gakumas-Localify-RU-unsigned.apk Gakumas-Localify-RU.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks release.jks \
            --ks-pass "pass:${{ secrets.KS_PASS }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --key-pass "pass:${{ secrets.KEY_PASS }}" \
            Gakumas-Localify-RU.apk

      - name: Patch Game APK with LSPatch & Repair Native Libraries
        if: steps.compare.outputs.should_build == 'true'
        env:
          GPLAY_EMAIL: ${{ secrets.GPLAY_EMAIL }}
          GPLAY_AAS_TOKEN: ${{ secrets.GPLAY_AAS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p patched_out
          java -jar tools/lspatch.jar clean_game/gaku_merged.apk \
            -m Gakumas-Localify-RU.apk \
            -k release.jks "${{ secrets.KS_PASS }}" "${{ secrets.KEY_ALIAS }}" "${{ secrets.KEY_PASS }}" \
            -o patched_out/

          LSPATCHED_APK="$(find patched_out -type f -name "*-lspatched.apk" -print -quit)"
          if [[ -z "$LSPATCHED_APK" ]]; then
            LSPATCHED_APK="$(find patched_out -type f -name '*.apk' -print -quit)"
          fi
          if [[ -z "$LSPATCHED_APK" || ! -s "$LSPATCHED_APK" ]]; then
            echo "::error::LSPatch did not produce a valid APK."
            find patched_out -maxdepth 2 -type f -print || true
            exit 1
          fi
          echo "LSPatch output: $LSPATCHED_APK"

          rm -rf fix_apk extracted_libs
          mkdir -p fix_apk extracted_libs
          unzip -q "$LSPATCHED_APK" -d fix_apk

          # The merged game APK exists even on a cache hit, while gplay_splits may not.
          # Always use it as the primary source of the original native libraries.
          if [[ -s clean_game/gaku_merged.apk ]]; then
            unzip -oq clean_game/gaku_merged.apk 'lib/*' -d extracted_libs || true
          fi

          # Supplement missing entries from the downloaded Google Play split APKs, when available.
          shopt -s nullglob
          split_apks=(gplay_splits/*.apk)
          for apk in "${split_apks[@]}"; do
            unzip -nq "$apk" 'lib/*' -d extracted_libs || true
          done

          restore_missing_native_libs() {
            [[ -d extracted_libs/lib ]] || return 0
            while IFS= read -r -d '' source_lib; do
              relative_path="${source_lib#extracted_libs/}"
              target_lib="fix_apk/$relative_path"
              if [[ ! -s "$target_lib" ]]; then
                mkdir -p "$(dirname "$target_lib")"
                cp -p "$source_lib" "$target_lib"
                echo "Restored missing native library: $relative_path"
              fi
            done < <(find extracted_libs/lib -type f -name '*.so' -print0)
          }
          restore_missing_native_libs

          # Older cached builds may not have gplay_splits/. If the merged APK also lacks
          # libmain.so, download the splits on demand rather than publish a broken APK.
          if [[ ! -s fix_apk/lib/arm64-v8a/libmain.so && ${#split_apks[@]} -eq 0 ]]; then
            echo "arm64-v8a/libmain.so is still missing; downloading original splits for recovery..."
            mkdir -p gplay_splits
            ./tools/apkeep -a com.bandainamcoent.idolmaster_gakuen \
              -d google-play \
              -e "$GPLAY_EMAIL" \
              -t "$GPLAY_AAS_TOKEN" \
              ./gplay_splits/

            split_apks=(gplay_splits/*.apk)
            for apk in "${split_apks[@]}"; do
              unzip -nq "$apk" 'lib/*' -d extracted_libs || true
            done
            restore_missing_native_libs
          fi

          if [[ ! -s fix_apk/lib/arm64-v8a/libmain.so ]]; then
            echo "::error::lib/arm64-v8a/libmain.so is missing after restoration. Refusing to publish a broken APK."
            echo "Native libraries in patched APK:"
            find fix_apk/lib -type f -name '*.so' -print 2>/dev/null || true
            echo "Native libraries found in original package:"
            find extracted_libs/lib -type f -name '*.so' -print 2>/dev/null || true
            exit 1
          fi
          echo "Verified source library:"
          ls -lh fix_apk/lib/arm64-v8a/libmain.so

          # Do not rebuild the entire ZIP: a full `zip -r` can change compression of
          # resources.arsc and native libraries. Update only lib/, preserving other APK entries.
          cp "$LSPATCHED_APK" final_unaligned.apk
          # Remove existing lib/ entries first so zip cannot skip a same-timestamp entry.
          # The extracted fix_apk/lib tree contains both preserved LSPatch libs and restored game libs.
          zip -q -d final_unaligned.apk 'lib/*' || true
          # Re-add only lib/, with every native library stored uncompressed.
          find fix_apk/lib -type f -exec touch -m {} +
          find fix_apk/lib -type d -exec touch -m {} +
          (
            cd fix_apk
            zip -q -0 -r ../final_unaligned.apk lib
          )

          # Check that libmain.so is present and all packaged native libraries are STORED.
          python3 - <<'PY'
          import zipfile
          apk_path = "final_unaligned.apk"
          required = "lib/arm64-v8a/libmain.so"
          with zipfile.ZipFile(apk_path) as apk:
              entries = {entry.filename: entry for entry in apk.infolist()}
              if required not in entries or entries[required].file_size == 0:
                  raise SystemExit(f"::error::{required} is missing or empty in final APK")
              compressed = [
                  entry.filename for entry in apk.infolist()
                  if entry.filename.startswith("lib/")
                  and entry.filename.endswith(".so")
                  and entry.compress_type != zipfile.ZIP_STORED
              ]
              if compressed:
                  raise SystemExit("::error::Compressed native libraries found: " + ", ".join(compressed[:20]))
              print(f"Verified {required} ({entries[required].file_size:,} bytes); all .so entries are uncompressed.")
          PY

          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          "$BUILD_TOOLS/zipalign" -P 16 -f 4 final_unaligned.apk final_aligned.apk
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 final_aligned.apk

          OUTPUT_APK="Gakumas-RU-${{ steps.gplay.outputs.game_ver }}.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks release.jks \
            --ks-pass "pass:${{ secrets.KS_PASS }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --key-pass "pass:${{ secrets.KEY_PASS }}" \
            --out "$OUTPUT_APK" \
            final_aligned.apk

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$OUTPUT_APK"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$OUTPUT_APK"
          ls -lh "$OUTPUT_APK"

      - name: Publish GitHub Release
        if: steps.compare.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.compare.outputs.combined_tag }}
          name: "Gakumas RU (${{ steps.gplay.outputs.game_ver }} | RU ${{ steps.check_upstreams.outputs.trans_tag }})"
          body: |
            ### Готовый APK Gakuen Idolmaster с вшитым русским переводом и Localify
            * **Версия игры (Google Play):** `${{ steps.gplay.outputs.game_ver }}`
            * **Версия перевода (Gakumas-Translation-Data-RU):** [`${{ steps.check_upstreams.outputs.trans_tag }}`](${{ steps.check_upstreams.outputs.trans_html_url }})
            * **Версия плагина (chinosk6 Localify):** [`${{ steps.check_upstreams.outputs.plugin_tag }}`](${{ steps.check_upstreams.outputs.plugin_html_url }})

            #### Установка:
            1. Скачайте и установите **`Gakumas-RU-${{ steps.gplay.outputs.game_ver }}.apk`** (Shizuku и ручной патчинг **не требуются**, перевод и шрифт уже вшиты внутрь).
            2. *(Опционально)* Установите **`Gakumas-Localify-RU.apk`**, если хотите менять настройки графики, 60 FPS, ориентацию экрана или подгружать обновления перевода без переустановки игры.
          files: |
            Gakumas-RU-${{ steps.gplay.outputs.game_ver }}.apk
            Gakumas-Localify-RU.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Discord Notification
        if: steps.compare.outputs.should_build == 'true'
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          LAST_TAG="${{ steps.compare.outputs.last_tag }}"
          CUR_GAME="${{ steps.compare.outputs.clean_game }}"
          CUR_PLUGIN="${{ steps.compare.outputs.clean_plugin }}"
          CUR_TRANS="${{ steps.compare.outputs.clean_trans }}"

          CHANGES=""
          if [ "$LAST_TAG" = "none" ]; then
            CHANGES="🎉 **Первый автоматический релиз готового APK!**"
          else
            OLD_GAME=$(echo "$LAST_TAG" | sed -n 's/^g\(.*\)_p\(.*\)_ru\(.*\)$/\1/p')
            OLD_PLUGIN=$(echo "$LAST_TAG" | sed -n 's/^g\(.*\)_p\(.*\)_ru\(.*\)$/\2/p')
            OLD_TRANS=$(echo "$LAST_TAG" | sed -n 's/^g\(.*\)_p\(.*\)_ru\(.*\)$/\3/p')

            if [ "$OLD_GAME" != "$CUR_GAME" ]; then
              CHANGES="${CHANGES}🎮 **Обновилась игра в Google Play:** \`${OLD_GAME:-?}\` ➔ \`${CUR_GAME}\`\n"
            fi
            if [ "$OLD_PLUGIN" != "$CUR_PLUGIN" ]; then
              CHANGES="${CHANGES}🛠️ **Обновился Gakumas Localify (chinosk6):** \`${OLD_PLUGIN:-?}\` ➔ \`${CUR_PLUGIN}\`\n"
            fi
            if [ "$OLD_TRANS" != "$CUR_TRANS" ]; then
              CHANGES="${CHANGES}🇷🇺 **Обновился русский перевод:** \`${OLD_TRANS:-?}\` ➔ \`${CUR_TRANS}\`\n"
            fi
            if [ -z "$CHANGES" ]; then
              CHANGES="🔄 **Принудительная пересборка APK** (версии компонентов не менялись)"
            fi
          fi

          CHANGES_FORMATTED=$(printf "%b" "$CHANGES")

          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${{ steps.compare.outputs.combined_tag }}"
          GAME_DL="https://github.com/${{ github.repository }}/releases/download/${{ steps.compare.outputs.combined_tag }}/Gakumas-RU-${{ steps.gplay.outputs.game_ver }}.apk"
          MANAGER_DL="https://github.com/${{ github.repository }}/releases/download/${{ steps.compare.outputs.combined_tag }}/Gakumas-Localify-RU.apk"
          ORIG_LOCALIFY_URL="${{ steps.check_upstreams.outputs.plugin_html_url }}"
          TRANS_REL_URL="${{ steps.check_upstreams.outputs.trans_html_url }}"

          jq -n \
            --arg title "Доступно обновление Gakumas RU (${{ steps.gplay.outputs.game_ver }})" \
            --arg url "$RELEASE_URL" \
            --arg changes "$CHANGES_FORMATTED" \
            --arg game_ver "${{ steps.gplay.outputs.game_ver }}" \
            --arg trans_ver "${{ steps.check_upstreams.outputs.trans_tag }}" \
            --arg plugin_ver "${{ steps.check_upstreams.outputs.plugin_tag }}" \
            --arg rel_url "$RELEASE_URL" \
            --arg game_dl "$GAME_DL" \
            --arg mgr_dl "$MANAGER_DL" \
            --arg orig_loc_url "$ORIG_LOCALIFY_URL" \
            --arg trans_url "$TRANS_REL_URL" \
            '{
              username: "Gakumas Auto-Patcher RU",
              embeds: [{
                title: $title,
                url: $url,
                color: 16738740,
                description: $changes,
                fields: [
                  { name: "Версия игры", value: ("`" + $game_ver + "`"), inline: true },
                  { name: "Русский перевод", value: ("[" + $trans_ver + "](" + $trans_url + ")"), inline: true },
                  { name: "Оригинал Localify", value: ("[" + $plugin_ver + "](" + $orig_loc_url + ")"), inline: true },
                  {
                    name: "Ссылки и скачивание",
                    value: (
                      "📦 **[Страница нашего релиза APK на GitHub](" + $rel_url + ")**\n" +
                      "📲 [Скачать готовый APK игры (Gakumas-RU.apk)](" + $game_dl + ")\n" +
                      "⚙️ [Скачать менеджер Gakumas-Localify-RU.apk](" + $mgr_dl + ")\n" +
                      "🔗 [Оригинальный репозиторий Localify (chinosk6)](" + $orig_loc_url + ")"
                    )
                  }
                ],
                timestamp: (now | todate)
              }]
            }' > payload.json

          curl -s -H "Content-Type: application/json" -X POST -d @payload.json "$WEBHOOK_URL"