name: Auto Patch Gakumas RU

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Принудительно пересобрать APK (даже если версии не менялись)'
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [translation-updated]

permissions:
  contents: write

jobs:
  build-patched-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Check Upstream Versions (Localify & RU Translation)
        id: check_upstreams
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Получаем реальную версию/тег исходников плагина chinosk6 с его git-сервера
          PLUGIN_INFO=$(curl -s https://git.chinosk6.cn/api/v1/repos/chinosk/gkms-local/releases/latest 2>/dev/null)
          PLUGIN_TAG=$(echo "$PLUGIN_INFO" | jq -r '.tag_name // empty')
          if [ -z "$PLUGIN_TAG" ] || [ "$PLUGIN_TAG" = "null" ]; then
            PLUGIN_TAG=$(curl -s https://git.chinosk6.cn/api/v1/repos/chinosk/gkms-local/commits?limit=1 2>/dev/null | jq -r '.[0].sha[0:7]' || echo "v3.6.0")
          fi
          PLUGIN_HTML_URL="https://git.chinosk6.cn/chinosk/gkms-local"

          # 2. Получаем релиз HunterKrendel234/Gakumas-Translation-Data-RU
          TRANS_JSON=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/HunterKrendel234/Gakumas-Translation-Data-RU/releases/latest)
          TRANS_TAG=$(echo "$TRANS_JSON" | jq -r '.tag_name // "v1.0.0"')
          TRANS_HTML_URL=$(echo "$TRANS_JSON" | jq -r '.html_url // "https://github.com/HunterKrendel234/Gakumas-Translation-Data-RU"')
          TRANS_URL=$(echo "$TRANS_JSON" | jq -r '[.assets[]? | select(.name | endswith(".zip")) | .browser_download_url] | first // empty')
          if [ -z "$TRANS_URL" ] || [ "$TRANS_URL" = "null" ]; then
            TRANS_URL=$(echo "$TRANS_JSON" | jq -r '.zipball_url // "https://github.com/HunterKrendel234/Gakumas-Translation-Data-RU/archive/refs/heads/main.zip"')
          fi

          echo "Plugin Tag: $PLUGIN_TAG"
          echo "Translation Tag: $TRANS_TAG"

          echo "plugin_tag=$PLUGIN_TAG" >> $GITHUB_OUTPUT
          echo "plugin_html_url=$PLUGIN_HTML_URL" >> $GITHUB_OUTPUT
          echo "trans_tag=$TRANS_TAG" >> $GITHUB_OUTPUT
          echo "trans_url=$TRANS_URL" >> $GITHUB_OUTPUT
          echo "trans_html_url=$TRANS_HTML_URL" >> $GITHUB_OUTPUT

      - name: Download Tools (apkeep, APKEditor, LSPatch)
        run: |
          mkdir -p tools

          # 1. apkeep
          wget -q https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-musl -O tools/apkeep || \
          wget -q https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu -O tools/apkeep
          chmod +x tools/apkeep

          # 2. APKEditor
          APKEDITOR_URL=$(curl -fsSL https://api.github.com/repos/REAndroid/APKEditor/releases/latest | jq -r '[.assets[]? | select(.name | ascii_downcase | endswith(".jar")) | .browser_download_url] | first // empty')
          if [ -z "$APKEDITOR_URL" ] || [ "$APKEDITOR_URL" = "null" ]; then
            echo "::error::Could not find the latest APKEditor JAR release asset."
            exit 1
          fi
          wget -q "$APKEDITOR_URL" -O tools/APKEditor.jar

          # 3. LSPatch (JingMatrix)
          LSPATCH_URL=$(curl -s https://api.github.com/repos/JingMatrix/LSPatch/releases/latest | jq -r '[.assets[]? | select(.name | endswith(".jar")) | .browser_download_url] | first // empty')
          if [ -z "$LSPATCH_URL" ] || [ "$LSPATCH_URL" = "null" ]; then
            LSPATCH_URL=$(curl -s https://api.github.com/repos/JingMatrix/LSPatch/releases/latest | jq -r '[.assets[]? | select(.name | endswith(".zip")) | .browser_download_url] | first // empty')
            wget -q "$LSPATCH_URL" -O tools/lspatch.zip
            unzip -q -j tools/lspatch.zip "*.jar" -d tools/
            find tools -maxdepth 1 -name '*.jar' ! -name 'APKEditor.jar' -exec mv {} tools/lspatch.jar \;
          else
            wget -q "$LSPATCH_URL" -O tools/lspatch.jar
          fi

          ls -lh tools/

      - name: Check Google Play Game Version
        id: gplay
        run: |
          APP_ID="com.bandainamcoent.idolmaster_gakuen"
          GAME_VER=$(./tools/apkeep -a "$APP_ID" -l -d google-play -e "${{ secrets.GPLAY_EMAIL }}" -t "${{ secrets.GPLAY_AAS_TOKEN }}" 2>/dev/null | tail -n 1 | sed -E 's/.*\| *([^ ]+).*/\1/' | tr -cd 'a-zA-Z0-9._-' || true)
          if [ -z "$GAME_VER" ]; then
            GAME_VER="latest"
          fi
          echo "Detected Game Version: $GAME_VER"
          echo "game_ver=$GAME_VER" >> $GITHUB_OUTPUT

      - name: Compare with Latest Published Release
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CLEAN_GAME=$(echo "${{ steps.gplay.outputs.game_ver }}" | tr -cd 'a-zA-Z0-9._-')
          CLEAN_PLUGIN=$(echo "${{ steps.check_upstreams.outputs.plugin_tag }}" | tr -cd 'a-zA-Z0-9._-')
          CLEAN_TRANS=$(echo "${{ steps.check_upstreams.outputs.trans_tag }}" | tr -cd 'a-zA-Z0-9._-')

          COMBINED_TAG="g${CLEAN_GAME}_p${CLEAN_PLUGIN}_ru${CLEAN_TRANS}_cfg5"
          echo "combined_tag=$COMBINED_TAG" >> $GITHUB_OUTPUT
          echo "clean_game=$CLEAN_GAME" >> $GITHUB_OUTPUT
          echo "clean_plugin=$CLEAN_PLUGIN" >> $GITHUB_OUTPUT
          echo "clean_trans=$CLEAN_TRANS" >> $GITHUB_OUTPUT

          LAST_TAG=$(gh release view --json tagName -q '.tagName' 2>/dev/null || echo "none")
          echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT

          if [ "$LAST_TAG" = "$COMBINED_TAG" ] && [ "${{ github.event.inputs.force_build }}" != "true" ]; then
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

      - name: Cache Merged Clean Game APK
        if: steps.compare.outputs.should_build == 'true'
        id: cache-game
        uses: actions/cache@v4
        with:
          path: clean_game/gaku_merged.apk
          # Ключ обновлён до v5, чтобы отбросить старый APK, склеенный с -extractNativeLibs false
          key: gakumas-clean-apk-v5-${{ steps.gplay.outputs.game_ver }}

      - name: Download & Merge Google Play Splits (upstream-compatible)
        if: steps.compare.outputs.should_build == 'true' && steps.cache-game.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          APP_ID="com.bandainamcoent.idolmaster_gakuen"
          DOWNLOAD_ROOT="gplay_splits"
          APP_SPLITS_DIR="$DOWNLOAD_ROOT/$APP_ID"
          mkdir -p "$DOWNLOAD_ROOT" clean_game

          ./tools/apkeep -a "$APP_ID" \
            -d google-play \
            -o "locale=jp,timezone=UTC+9,split_apk=1,include_additional_files=true" \
            -e "${{ secrets.GPLAY_EMAIL }}" \
            -t "${{ secrets.GPLAY_AAS_TOKEN }}" \
            "$DOWNLOAD_ROOT"

          if [[ ! -d "$APP_SPLITS_DIR" ]] || ! find "$APP_SPLITS_DIR" -type f -name '*.apk' -print -quit 2>/dev/null | grep -q .; then
            if find "$DOWNLOAD_ROOT" -maxdepth 1 -type f -name '*.apk' -print -quit | grep -q .; then
              APP_SPLITS_DIR="$DOWNLOAD_ROOT"
            else
              FOUND_DIR="$(find "$DOWNLOAD_ROOT" -mindepth 1 -maxdepth 1 -type d -print -quit)"
              if [[ -n "$FOUND_DIR" ]] && find "$FOUND_DIR" -type f -name '*.apk' -print -quit | grep -q .; then
                APP_SPLITS_DIR="$FOUND_DIR"
              fi
            fi
          fi

          mapfile -t SPLIT_APKS < <(find "$APP_SPLITS_DIR" -type f -name '*.apk' -print | sort)
          if [[ ${#SPLIT_APKS[@]} -eq 0 ]]; then
            echo "::error::apkeep did not download any APK files."
            exit 1
          fi

          HAS_MAIN_IN_INPUT=false
          for apk in "${SPLIT_APKS[@]}"; do
            if unzip -Z1 "$apk" | grep -Fx 'lib/arm64-v8a/libmain.so' >/dev/null; then
              HAS_MAIN_IN_INPUT=true
              echo "Found lib/arm64-v8a/libmain.so in source split: $apk"
            fi
          done
          if [[ "$HAS_MAIN_IN_INPUT" != true ]]; then
            echo "::error::The downloaded Google Play APK set contains no lib/arm64-v8a/libmain.so."
            exit 1
          fi

          # Слияние сплитов как в Kajaqq/gaku-patcher и fullpie/Gakumas_apptest (без -extractNativeLibs false)
          java -jar tools/APKEditor.jar m \
            -i "$APP_SPLITS_DIR" \
            -o clean_game/gaku_merged.apk

          python3 - <<'PYVERIFY'
          import sys, zipfile
          apk_path = "clean_game/gaku_merged.apk"
          for required in ("lib/arm64-v8a/libmain.so", "lib/arm64-v8a/libil2cpp.so"):
              with zipfile.ZipFile(apk_path) as apk:
                  entries = {item.filename: item for item in apk.infolist()}
                  item = entries.get(required)
                  if item is None or item.file_size == 0:
                      raise SystemExit(f"ERROR: {required} is absent/empty after APKEditor merge")
                  print(f"Verified merged {required}: {item.file_size:,} bytes")
          PYVERIFY

          ls -lh clean_game/gaku_merged.apk

      - name: Restore Keystore
        if: steps.compare.outputs.should_build == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.jks

      - name: Build Localify RU APK, configure API defaults, and bundle Russian assets
        if: steps.compare.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRANS_URL: ${{ steps.check_upstreams.outputs.trans_url }}
          TRANS_TAG: ${{ steps.check_upstreams.outputs.trans_tag }}
          RU_API_URL: https://api.github.com/repos/HunterKrendel234/Gakumas-Translation-Data-RU/releases/latest
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 --recurse-submodules https://git.chinosk6.cn/chinosk/gkms-local.git localify-source || \
          git clone --depth 1 https://git.chinosk6.cn/chinosk/gkms-local.git localify-source
          cd localify-source

          curl -fSL --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$TRANS_URL" -o ../ru_trans.zip
          unzip -tq ../ru_trans.zip
          rm -rf ../work_ru
          mkdir -p ../work_ru
          unzip -q ../ru_trans.zip -d ../work_ru

          RU_LOCALIZATION_FILE="$(find ../work_ru -type f -path '*/local-files/localization.json' -print -quit)"
          if [[ -z "$RU_LOCALIZATION_FILE" || ! -s "$RU_LOCALIZATION_FILE" ]]; then
            echo "::error::Russian release archive has no non-empty local-files/localization.json"
            exit 1
          fi
          RU_ROOT="${RU_LOCALIZATION_FILE%/local-files/localization.json}"
          RU_FILES="$RU_ROOT/local-files"
          [[ -s "$RU_FILES/generic.json" || -d "$RU_FILES/genericTrans" ]] || {
            echo "::error::Russian translation archive lacks generic.json and genericTrans/"
            exit 1
          }

          TARGET_ASSET_DIR="app/src/main/assets/gakumas-local"
          mkdir -p "$TARGET_ASSET_DIR"

          rm -rf "$TARGET_ASSET_DIR/local-files"
          mkdir -p "$TARGET_ASSET_DIR/local-files"
          cp -a "$RU_FILES/." "$TARGET_ASSET_DIR/local-files/"

          if [[ -s "$RU_ROOT/version.txt" ]]; then
            cp "$RU_ROOT/version.txt" "$TARGET_ASSET_DIR/version.txt"
          else
            printf '%s\n' "$TRANS_TAG" > "$TARGET_ASSET_DIR/version.txt"
          fi

          RU_FONT_NAME=""
          if [[ -s "$TARGET_ASSET_DIR/local-files/gkanz0-ontMIX.otf" ]]; then
            RU_FONT_NAME="gkanz0-ontMIX.otf"
          else
            FOUND_FONT="$(find "$TARGET_ASSET_DIR/local-files" -maxdepth 1 -type f \( -iname '*.otf' -o -iname '*.ttf' \) -printf '%f\n' | head -n 1 || true)"
            if [[ -n "$FOUND_FONT" ]]; then
              RU_FONT_NAME="$FOUND_FONT"
            fi
          fi
          echo "Detected RU Font: ${RU_FONT_NAME:-default}"

          python3 - "$RU_FONT_NAME" <<'PYCONFIG'
          import json
          import re
          import sys
          from pathlib import Path

          ru_font = sys.argv[1] if len(sys.argv) > 1 else ""
          ru_api = "https://api.github.com/repos/HunterKrendel234/Gakumas-Translation-Data-RU/releases/latest"
          root = Path.cwd()
          target_assets = root / "app/src/main/assets/gakumas-local"

          def set_bool_property(path: Path, key: str, value: bool, required: bool = True):
              text = path.read_text(encoding="utf-8")
              pattern = re.compile(rf"(\bvar\s+{re.escape(key)}\s*:\s*Boolean\s*=\s*)(true|false)\b")
              updated, count = pattern.subn(lambda m: m.group(1) + ("true" if value else "false"), text)
              if required and count != 1:
                  raise SystemExit(f"Expected exactly one Boolean default for {key} in {path}, found {count}")
              if count:
                  path.write_text(updated, encoding="utf-8")
                  print(f"Set {path}: {key}={str(value).lower()}")

          gakumas_models = list((root / "app/src/main/java").rglob("GakumasConfig.kt"))
          if len(gakumas_models) != 1:
              raise SystemExit(f"Expected one GakumasConfig.kt, found {len(gakumas_models)}")
          gakumas_model = gakumas_models[0]

          # Оставляем lazyInit в значении апстрима, чтобы хук Activity гарантированно инициализировал libil2cpp.so
          set_bool_property(gakumas_model, "replaceTexture", False)
          set_bool_property(gakumas_model, "useMasterTrans", True)
          set_bool_property(gakumas_model, "enabled", True, required=False)

          if ru_font:
              g_text = gakumas_model.read_text(encoding="utf-8")
              font_pattern = re.compile(r'(\bvar\s+fontAssetName\s*:\s*String\s*=\s*)"(?:[^"\\]|\\.)*"')
              g_text, f_count = font_pattern.subn(lambda m: m.group(1) + json.dumps(ru_font), g_text)
              if f_count:
                  gakumas_model.write_text(g_text, encoding="utf-8")
                  print(f"Set {gakumas_model}: fontAssetName={ru_font}")

          program_models = list((root / "app/src/main/java").rglob("ProgramConfig.kt"))
          if len(program_models) != 1:
              raise SystemExit(f"Expected one ProgramConfig.kt, found {len(program_models)}")
          program_model = program_models[0]

          # ВАЖНО: checkBuiltInAssets = True позволяет встроенному модулю распаковать
          # вшитые в assets/gakumas-local файлы перевода в папку игры
          set_bool_property(program_model, "checkBuiltInAssets", True)
          set_bool_property(program_model, "useRemoteAssets", False)
          set_bool_property(program_model, "useAPIAssets", True)
          set_bool_property(program_model, "useAPITextureAssets", False)

          program_text = program_model.read_text(encoding="utf-8")
          url_pattern = re.compile(r'(\bvar\s+useAPIAssetsURL\s*:\s*String\s*=\s*)"(?:[^"\\]|\\.)*"')
          program_text, url_count = url_pattern.subn(lambda m: m.group(1) + json.dumps(ru_api), program_text)
          if url_count != 1:
              raise SystemExit(f"Expected exactly one useAPIAssetsURL default in {program_model}, found {url_count}")
          program_model.write_text(program_text, encoding="utf-8")
          print(f"Set {program_model}: useAPIAssetsURL={ru_api}")

          values_dir = root / "app/src/main/res"
          string_resources = list(values_dir.glob("values*/strings.xml"))
          string_re = re.compile(r'(<string\s+name="default_assets_check_api"[^>]*>)(.*?)(</string>)', re.DOTALL)
          for path in string_resources:
              text = path.read_text(encoding="utf-8")
              updated, count = string_re.subn(lambda m: m.group(1) + ru_api + m.group(3), text)
              if count:
                  path.write_text(updated, encoding="utf-8")

          config_candidates = list((root / "app/src/main/assets").rglob("localizationConfig.json"))
          for path in config_candidates:
              config = json.loads(path.read_text(encoding="utf-8"))
              config["enabled"] = True
              config["replaceTexture"] = False
              config["useMasterTrans"] = True
              if ru_font and "fontAssetName" in config:
                  config["fontAssetName"] = ru_font
              path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          for required in ("localization.json",):
              p = target_assets / "local-files" / required
              if not p.is_file() or p.stat().st_size == 0:
                  raise SystemExit(f"Missing/empty bundled Russian file: {p}")
          PYCONFIG

          chmod +x gradlew
          ./gradlew assembleRelease

          BUILT_APK="$(find app/build/outputs/apk -type f -name '*release*.apk' -print -quit)"
          if [[ -z "$BUILT_APK" || ! -s "$BUILT_APK" ]]; then
            BUILT_APK="$(find . -type f -name '*release*.apk' -not -path './.gradle/*' -print -quit)"
          fi
          if [[ -z "$BUILT_APK" || ! -s "$BUILT_APK" ]]; then
            echo "::error::Could not find the compiled Localify release APK"
            exit 1
          fi

          cp "$BUILT_APK" ../Gakumas-Localify-RU-unsigned.apk
          cd ..

          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          "$BUILD_TOOLS/zipalign" -p -f 4 Gakumas-Localify-RU-unsigned.apk Gakumas-Localify-RU-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks release.jks \
            --ks-pass "pass:${{ secrets.KS_PASS }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --key-pass "pass:${{ secrets.KEY_PASS }}" \
            --out Gakumas-Localify-RU.apk \
            Gakumas-Localify-RU-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose Gakumas-Localify-RU.apk
          ls -lh Gakumas-Localify-RU.apk

      - name: Patch Game APK with LSPatch (publish its output unchanged)
        if: steps.compare.outputs.should_build == 'true'
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
          GAME_VER: ${{ steps.gplay.outputs.game_ver }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf patched_out
          mkdir -p patched_out
          java -jar tools/lspatch.jar clean_game/gaku_merged.apk \
            -m Gakumas-Localify-RU.apk \
            -k release.jks "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" \
            -o patched_out/

          LSPATCHED_APK="$(find patched_out -type f -name '*-lspatched.apk' -print -quit)"
          if [[ -z "$LSPATCHED_APK" ]]; then
            LSPATCHED_APK="$(find patched_out -type f -name '*.apk' -print -quit)"
          fi
          if [[ -z "$LSPATCHED_APK" || ! -s "$LSPATCHED_APK" ]]; then
            echo "::error::LSPatch did not produce a valid APK."
            exit 1
          fi

          OUTPUT_APK="Gakumas-RU-${GAME_VER}.apk"
          cp -- "$LSPATCHED_APK" "$OUTPUT_APK"
          ls -lh "$OUTPUT_APK"
          sha256sum "$OUTPUT_APK"

      - name: Publish GitHub Release
        if: steps.compare.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.compare.outputs.combined_tag }}
          name: "Gakumas RU (${{ steps.gplay.outputs.game_ver }} | RU ${{ steps.check_upstreams.outputs.trans_tag }})"
          body: |
            ### Готовый APK Gakuen Idolmaster с вшитым русским переводом и Localify
            * **Версия игры (Google Play):** `${{ steps.gplay.outputs.game_ver }}`
            * **Версия перевода (Gakumas-Translation-Data-RU):** [`${{ steps.check_upstreams.outputs.trans_tag }}`](${{ steps.check_upstreams.outputs.trans_html_url }})
            * **Версия плагина (chinosk6 Localify):** [`${{ steps.check_upstreams.outputs.plugin_tag }}`](${{ steps.check_upstreams.outputs.plugin_html_url }})

            #### Установка:
            1. Установите **`Gakumas-RU-${{ steps.gplay.outputs.game_ver }}.apk`** и **`Gakumas-Localify-RU.apk`** из одного релиза.
            2. Русский пакет уже встроен и распаковывается автоматически при первом запуске игры.
            3. Если вы меняете настройки в **`Gakumas-Localify-RU`** или скачиваете обновление перевода через API, **запускайте игру кнопкой внутри приложения Localify** (если игра уже была открыта в фоне — предварительно закройте её), чтобы Localify передал новые параметры в пропатченную игру.
          files: |
            Gakumas-RU-${{ steps.gplay.outputs.game_ver }}.apk
            Gakumas-Localify-RU.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Discord Notification
        if: steps.compare.outputs.should_build == 'true'
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          LAST_TAG="${{ steps.compare.outputs.last_tag }}"
          CUR_GAME="${{ steps.compare.outputs.clean_game }}"
          CUR_PLUGIN="${{ steps.compare.outputs.clean_plugin }}"
          CUR_TRANS="${{ steps.compare.outputs.clean_trans }}"

          CHANGES=""
          if [ "$LAST_TAG" = "none" ]; then
            CHANGES="🎉 **Первый автоматический релиз готового APK!**"
          else
            LAST_TAG_CORE=$(echo "$LAST_TAG" | sed -E 's/_cfg[0-9]+$//')
            OLD_GAME=$(echo "$LAST_TAG_CORE" | sed -n 's/^g\(.*\)_p\(.*\)_ru\(.*\)$/\1/p')
            OLD_PLUGIN=$(echo "$LAST_TAG_CORE" | sed -n 's/^g\(.*\)_p\(.*\)_ru\(.*\)$/\2/p')
            OLD_TRANS=$(echo "$LAST_TAG_CORE" | sed -n 's/^g\(.*\)_p\(.*\)_ru\(.*\)$/\3/p')

            if [ "$OLD_GAME" != "$CUR_GAME" ]; then
              CHANGES="${CHANGES}🎮 **Обновилась игра в Google Play:** \`${OLD_GAME:-?}\` ➔ \`${CUR_GAME}\`\n"
            fi
            if [ "$OLD_PLUGIN" != "$CUR_PLUGIN" ]; then
              CHANGES="${CHANGES}🛠️ **Обновился Gakumas Localify (chinosk6):** \`${OLD_PLUGIN:-?}\` ➔ \`${CUR_PLUGIN}\`\n"
            fi
            if [ "$OLD_TRANS" != "$CUR_TRANS" ]; then
              CHANGES="${CHANGES}🇷🇺 **Обновился русский перевод:** \`${OLD_TRANS:-?}\` ➔ \`${CUR_TRANS}\`\n"
            fi
            if [ -z "$CHANGES" ]; then
              CHANGES="🔄 **Принудительная пересборка APK** (версии компонентов не менялись)"
            fi
          fi

          CHANGES_FORMATTED=$(printf "%b" "$CHANGES")

          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${{ steps.compare.outputs.combined_tag }}"
          GAME_DL="https://github.com/${{ github.repository }}/releases/download/${{ steps.compare.outputs.combined_tag }}/Gakumas-RU-${{ steps.gplay.outputs.game_ver }}.apk"
          MANAGER_DL="https://github.com/${{ github.repository }}/releases/download/${{ steps.compare.outputs.combined_tag }}/Gakumas-Localify-RU.apk"
          ORIG_LOCALIFY_URL="${{ steps.check_upstreams.outputs.plugin_html_url }}"
          TRANS_REL_URL="${{ steps.check_upstreams.outputs.trans_html_url }}"

          jq -n \
            --arg title "Доступно обновление Gakumas RU (${{ steps.gplay.outputs.game_ver }})" \
            --arg url "$RELEASE_URL" \
            --arg changes "$CHANGES_FORMATTED" \
            --arg game_ver "${{ steps.gplay.outputs.game_ver }}" \
            --arg trans_ver "${{ steps.check_upstreams.outputs.trans_tag }}" \
            --arg plugin_ver "${{ steps.check_upstreams.outputs.plugin_tag }}" \
            --arg rel_url "$RELEASE_URL" \
            --arg game_dl "$GAME_DL" \
            --arg mgr_dl "$MANAGER_DL" \
            --arg orig_loc_url "$ORIG_LOCALIFY_URL" \
            --arg trans_url "$TRANS_REL_URL" \
            '{
              username: "Gakumas Auto-Patcher RU",
              embeds: [{
                title: $title,
                url: $url,
                color: 16738740,
                description: $changes,
                fields: [
                  { name: "Версия игры", value: ("`" + $game_ver + "`"), inline: true },
                  { name: "Русский перевод", value: ("[" + $trans_ver + "](" + $trans_url + ")"), inline: true },
                  { name: "Оригинал Localify", value: ("[" + $plugin_ver + "](" + $orig_loc_url + ")"), inline: true },
                  {
                    name: "Ссылки и скачивание",
                    value: (
                      "📦 **[Страница нашего релиза APK на GitHub](" + $rel_url + ")**\n" +
                      "📲 [Скачать готовый APK игры (Gakumas-RU.apk)](" + $game_dl + ")\n" +
                      "⚙️ [Скачать менеджер Gakumas-Localify-RU.apk](" + $mgr_dl + ")\n" +
                      "🔗 [Оригинальный репозиторий Localify (chinosk6)](" + $orig_loc_url + ")"
                    )
                  }
                ],
                timestamp: (now | todate)
              }]
            }' > payload.json

          curl -s -H "Content-Type: application/json" -X POST -d @payload.json "$WEBHOOK_URL"